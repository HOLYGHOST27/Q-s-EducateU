<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Educate U</title>
    <link rel="icon" type="image/png" href="images/EducateULogo-removebg-preview.png">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@500;600&display=swap" rel="stylesheet">
    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/math.css">
    <link rel="stylesheet" href="css/reading.css"> <!-- Add this line -->
</head>
<body class="dashboard-bg">

    <!-- 1. DASHBOARD VIEW (Shown by default) -->
    <div id="dashboard-view">
        <header class="app-header" style="text-align: center; margin-bottom: 25px;">
            <img src="images/EducateULogo-removebg-preview.png" alt="Educate U Logo" class="spinning-logo" style="width: 220px; height: 220px; margin-bottom: 2px; object-fit: contain;">
            <h1 style="font-family: 'Playfair Display', serif; font-size: 3rem; font-weight: 700; color: #1e293b; letter-spacing: 1px; margin-bottom: 8px;">Welcome to Educate U!</h1>
            <p style="font-family: 'Inter', sans-serif; font-size: 1.25rem; color: #3b82f6; font-weight: 600; letter-spacing: 0.5px;">Choose a subject below to start practicing:</p>
        </header>

        <main class="card-grid">
            <button class="subject-card" onclick="startSubject('Math')">
                <span class="card-icon">🔢</span>
                <h2>Math Lab</h2>
            </button>
            
            <button class="subject-card" onclick="startSubject('Typing')">
                <span class="card-icon">⌨️</span>
                <h2>Typing Quest</h2>
            </button>

            <button class="subject-card" onclick="startSubject('Reading')">
                <span class="card-icon">📚</span>
                <h2>Reading & Sight Words</h2>
            </button>
        </main>
    </div>

    <!-- 2. LESSON VIEW (Hidden by default) -->
    <div id="lesson-view" class="hidden">
        <nav class="top-nav">
            <button class="home-btn" onclick="goHome()">🏠 Home</button>
            <h2 id="lesson-title">Subject Title</h2>
        </nav>

        <main id="lesson-workspace">
            <p id="lesson-description">Workspace loading...</p>
        </main>
    </div>

    <!-- Load scripts at the bottom -->
    <script src="js/main.js"></script>
    <script src="js/math.js"></script>
    <script src="js/typing.js"></script>
    <script src="js/reading.js"></script>
</body>
</html>
